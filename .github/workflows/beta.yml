name: Beta release

on:
  workflow_dispatch:
    inputs:
      release_candidate_ref:
        description: Release candidate branch, tag, or commit SHA
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_candidate_ref }}
          fetch-depth: 0

      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 11

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Build Shaded JAR
        run: |
          COMMIT_SHA=$(git rev-parse --short HEAD)
          ./gradlew :client:shadowJar -Pmicrobot.commit.sha=$COMMIT_SHA

      - name: Read microbot.version from Gradle
        id: version
        run: |
          V=$(./gradlew -q properties --console=plain | sed -n 's/^microbot.version: //p')
          if [ -z "$V" ]; then V=$(grep '^microbot.version=' gradle.properties | cut -d= -f2); fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Using version: $V"

      - name: Prepare artifact name
        run: |
          SRC=$(echo runelite-client/build/libs/client-*-shaded.jar)
          DEST=runelite-client/build/libs/microbot-beta-${{ steps.version.outputs.version }}.jar
          cp "$SRC" "$DEST"

      - name: Generate release metadata
        run: |
          scripts/generate-release-metadata.sh \
            beta \
            "${{ steps.version.outputs.version }}" \
            "runelite-client/build/libs/microbot-beta-${{ steps.version.outputs.version }}.jar" \
            "https://files.microbot.cloud/releases/microbot/beta"

      - name: Validate release artifacts
        run: |
          scripts/validate-release-artifacts.sh \
            beta \
            "${{ steps.version.outputs.version }}" \
            "runelite-client/build/libs/microbot-beta-${{ steps.version.outputs.version }}.jar"

      - name: Create Release
        uses: "marvinpinto/action-automatic-releases@latest"
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: "beta"
          prerelease: true
          title: "Beta Build"
          files: |
            /home/runner/work/Microbot/Microbot/runelite-client/build/libs/microbot-beta-*.jar
            /home/runner/work/Microbot/Microbot/runelite-client/build/libs/microbot-beta-*.jar.sha256
            /home/runner/work/Microbot/Microbot/runelite-client/build/libs/update-beta.json

      - name: Upload beta artifacts to Hetzner
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_HOST }}
          username: root
          key: ${{ secrets.PROD_SSH_KEY }}
          source: runelite-client/build/libs/microbot-beta-*.jar,runelite-client/build/libs/microbot-beta-*.jar.sha256,runelite-client/build/libs/update-beta.json
          target: /var/www/files/releases/microbot/beta/
          strip_components: 3
